services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: proxynexus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proxynexus
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API -- this is what the web app fetches images from
      - "9001:9001"   # Web console (browse the bucket, optional)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init: creates the bucket, makes it publicly readable (the web
  # app's <img src> tags fetch anonymously), and mirrors in the bundled
  # collection images from ./data/collections. Runs on every `docker
  # compose up` and exits when done -- that's expected, and safe to
  # re-run (mc mirror --overwrite only touches what's actually changed).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/collections:/collections:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 proxynexus ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/proxynexus-collections &&
      mc anonymous set download local/proxynexus-collections &&
      mc mirror --overwrite /collections local/proxynexus-collections
      "

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Set in .env -- must be the Docker host's real LAN IP or hostname,
        # not "localhost", unless you'll only ever browse from the Docker
        # host itself. This gets baked into the compiled WASM at build
        # time, so "localhost" would resolve to whatever machine the
        # browser itself runs on, not the Docker host.
        PROXYNEXUS_COLLECTIONS_URL: ${PROXYNEXUS_COLLECTIONS_URL}
    container_name: proxynexus-web
    ports:
      - "8050:80"
    depends_on:
      - minio-init

volumes:
  minio-data:
