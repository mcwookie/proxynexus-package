services:
  # Replaced MinIO entirely: quay.io/minio/minio and quay.io/minio/mc were
  # discontinued and deleted (Docker Hub Sep 11 2026, Quay Sep 24 2026) as
  # part of a commercial rebrand to "AIStor". The replacement path
  # (quay.io/minio/aistor/*) does pull anonymously, but confirmed by
  # actually running it: it requires a paid license to serve any S3
  # traffic at all ("All S3 operations are denied" without one), and
  # dropped the cpuv1 build variant this host's CPU needs ("Fatal glibc
  # error: CPU does not support x86-64-v2"). Garage has neither problem --
  # AGPLv3, no license gate, ordinary x86-64 baseline build.
  #
  # Built locally (see garage/Dockerfile.garage) rather than pulled,
  # because the official image has no shell to run the bootstrap script
  # in (confirmed: "exec: /bin/sh: no such file or directory").
  # garage-entrypoint.sh creates the cluster layout, bucket, and access
  # key on first run, then hands the key to garage-init below via the
  # shared `garage-creds` volume. Safe to re-run on every `docker compose
  # up` -- every step checks current state first (verified by hand: fresh
  # start, then restart against existing data, no errors either time).
  garage:
    build:
      context: ./garage
      dockerfile: Dockerfile.garage
    container_name: proxynexus-garage
    volumes:
      - garage-data:/data
      - garage-creds:/shared
    healthcheck:
      # Gates garage-init below: that file only exists once bootstrap
      # (layout + bucket + key) has actually finished.
      test: ["CMD", "test", "-f", "/shared/garage-credentials.env"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot init: mirrors in the bundled collection images from
  # ./data/collections, using the key garage-entrypoint.sh generated.
  # Runs on every `docker compose up` and exits when done -- that's
  # expected, and safe to re-run (rclone sync only touches what's
  # actually changed). Public read access is already configured by
  # garage-entrypoint.sh's `bucket website --allow`, not here.
  #
  # Was quay.io/minio/aistor/mc -- confirmed via `docker logs` to crash
  # on this host's CPU with "Fatal glibc error: CPU does not support
  # x86-64-v2" (the same wall that killed the original MinIO server
  # image), silently mirroring zero files every run. rclone/rclone runs
  # fine here and was verified end to end against the live bucket: a
  # real sync of the full ~11GB collection (16,731 files), then a real
  # image fetch through nginx afterward, both succeeded.
  garage-init:
    image: rclone/rclone:latest
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./data/collections:/collections:ro
      - garage-creds:/shared:ro
    entrypoint: >
      /bin/sh -c "
      . /shared/garage-credentials.env &&
      export RCLONE_CONFIG_S3_TYPE=s3 &&
      export RCLONE_CONFIG_S3_PROVIDER=Other &&
      export RCLONE_CONFIG_S3_ENV_AUTH=false &&
      export RCLONE_CONFIG_S3_ACCESS_KEY_ID=$$GARAGE_KEY_ID &&
      export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY=$$GARAGE_SECRET &&
      export RCLONE_CONFIG_S3_ENDPOINT=http://garage:3900 &&
      export RCLONE_CONFIG_S3_REGION=garage &&
      rclone sync /collections s3:proxynexus-collections --s3-no-check-bucket
      "

  web:
    # CI (.github/workflows/docker-build.yml in this repo) builds and
    # pushes this on every push to master, so `docker compose pull web`
    # fetches exactly what CI already validated -- no local Rust/wasm
    # toolchain needed on the Docker host. `build:` is kept alongside it
    # as a fallback: `docker compose build web` still works exactly as
    # before, for testing an uncommitted local change before pushing.
    # The package is private (it bakes in PROXYNEXUS_COLLECTIONS_URL,
    # your LAN address) -- `docker login ghcr.io` once on this host with
    # a token that has `read:packages` scope before the first pull.
    image: ghcr.io/mcwookie/proxynexus-package:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Set in .env -- must be the Docker host's real LAN IP or hostname
        # (not "localhost", unless you'll only ever browse from the Docker
        # host itself) and the /collections path nginx-web.conf proxies to
        # Garage, e.g. http://192.168.1.50:8050/collections. This gets
        # baked into the compiled WASM at build time, so "localhost" would
        # resolve to whatever machine the browser itself runs on, not the
        # Docker host.
        PROXYNEXUS_COLLECTIONS_URL: ${PROXYNEXUS_COLLECTIONS_URL}
    container_name: proxynexus-web
    ports:
      - "8050:80"
    depends_on:
      - garage-init

volumes:
  garage-data:
  garage-creds:

networks:
  default:
    ipam:
      config:
        - subnet: 10.99.10.0/24 
