server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Garage's public-read mechanism is Host-header-based (its "website"
    # feature), not path-style like MinIO's anonymous bucket policy was --
    # confirmed by testing both directly. A bare LAN IP:port never matches
    # a bucket's Host, so proxy through here instead: the browser hits one
    # ordinary port, nginx forwards to Garage's internal website port with
    # the Host it actually expects. PROXYNEXUS_COLLECTIONS_URL should point
    # at http://<host>:8050/collections for this to line up.
    location /collections/ {
        proxy_pass http://garage:3902/;
        proxy_set_header Host proxynexus-collections;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
